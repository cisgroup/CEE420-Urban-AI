[project]
name = "urban-ai"
version = "2026.9"
description = "CEE420 Urban AI course environment, Princeton University, Fall 2026"
requires-python = "==3.12.*"
dependencies = [
    # core geospatial stack (P01+)
    "geopandas>=1.1,<2",
    "pyogrio>=0.13,<1",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "osmnx>=2.1,<3",
    "folium>=0.20,<1",
    "mapclassify>=2.9,<3",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    # raster + ML additions for P02-P05 (first-half stack)
    "rasterio>=1.4,<2",
    "rioxarray>=0.19,<1",
    "xarray>=2025.1",
    "contextily>=1.6,<2",
    "scikit-learn>=1.6,<2",
    # cloud catalogs for L03 figures and P04 (STAC search, signed Planetary Computer assets, windows as xarray)
    "pystac-client>=0.8,<1",
    "planetary-computer>=1.0,<2",
    "odc-stac>=0.4,<1",
    # deep learning for P05 (the U-Net of Lecture 05 and the learned features of 04_03); on Linux the CPU builds come
    # from the PyTorch index, so the container and a Linux laptop never download the CUDA libraries
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    # notebooks
    "ipykernel>=6",
    "jupyterlab>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "nbmake>=1.5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--nbmake --nbmake-timeout=900 -m 'not network'"
testpaths = ["tests", "F00", "P01", "A01", "P02", "P03", "P04", "P03b", "P05"]
markers = ["network: hits a live service, deselected by default", "slow: trains the P04 forests ten times, about a minute"]
